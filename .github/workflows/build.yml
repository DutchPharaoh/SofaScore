name: Build patches

on:
  workflow_dispatch:
  push:

permissions:
  contents: write
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build .mpp
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          chmod +x gradlew
          ./gradlew :patches:buildAndroid --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: patches
          path: patches/build/libs/patches-*.mpp

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(grep '^version' gradle.properties | cut -d= -f2 | tr -d ' ')
          FILE=$(ls patches/build/libs/patches-*.mpp | head -1)
          gh release create "v$VERSION" "$FILE" --title "v$VERSION" --notes "Sofascore 26.11.03 patches" \
            || gh release upload "v$VERSION" "$FILE" --clobber
